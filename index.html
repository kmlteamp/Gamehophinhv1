<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHATNCBAI</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    font-family: Arial, sans-serif;
    background: #eef2f7;
}

.app {
    width: 100%;
    max-width: 900px;
    height: 100vh;
    margin: auto;

    display: flex;
    flex-direction: column;

    background: white;
}

/* ================= HEADER ================= */

.header {
    height: 70px;
    flex-shrink: 0;

    display: flex;
    align-items: center;

    gap: 12px;
    padding: 10px 15px;

    border-bottom: 1px solid #ddd;
}

.avatar {
    width: 48px;
    height: 48px;

    border-radius: 50%;

    object-fit: cover;
}

.name {
    font-size: 20px;
    font-weight: bold;
}

.status {
    margin-top: 3px;

    color: #18a558;

    font-size: 13px;
}

/* ================= CHAT ================= */

.chat {
    flex: 1;
    min-height: 0;

    overflow-y: auto;

    padding: 20px 15px;
}

.message {
    width: 100%;

    display: flex;

    margin-bottom: 15px;
}

.message.ai {
    justify-content: flex-start;
}

.message.user {
    justify-content: flex-end;
}

.bubble {
    max-width: 80%;

    padding: 12px 15px;

    border-radius: 18px;

    font-size: 16px;
    line-height: 1.5;

    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.ai .bubble {
    background: #edf0f5;

    color: #111;

    border-bottom-left-radius: 5px;
}

.user .bubble {
    background: #246bfd;

    color: white;

    border-bottom-right-radius: 5px;
}

/* ================= QUICK BUTTON ================= */

.quick {
    flex-shrink: 0;

    padding: 8px 15px;
}

.quick button {
    padding: 9px 15px;

    border: 1px solid #ccd5e2;

    border-radius: 20px;

    background: white;

    cursor: pointer;

    font-size: 14px;
}

.quick button:active {
    transform: scale(.96);
}

/* ================= INPUT ================= */

.input-area {
    flex-shrink: 0;

    display: flex;

    gap: 8px;

    padding: 10px 15px 15px;

    border-top: 1px solid #ddd;

    background: white;
}

#messageInput {
    flex: 1;

    min-width: 0;

    height: 50px;

    padding: 0 15px;

    border: 1px solid #cbd3df;

    border-radius: 15px;

    outline: none;

    font-size: 16px;
}

#messageInput:focus {
    border-color: #246bfd;
}

#sendButton {
    width: 80px;

    height: 50px;

    border: none;

    border-radius: 15px;

    background: #246bfd;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}

#sendButton:active {
    transform: scale(.94);
}

#sendButton:disabled {
    opacity: .6;
}

/* ================= MOBILE ================= */

@media(max-width:600px) {

    .name {
        font-size: 18px;
    }

    .bubble {
        max-width: 85%;
    }

    #sendButton {
        width: 70px;
    }

}
</style>
</head>


<body>

<div class="app">


    <!-- ================= HEADER ================= -->

    <div class="header">

        <img
            class="avatar"
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSWIfjgbrzcACUkgXyYLLNBlP--ZKC_79-ZBKwkFLeX4A&s"
            alt="CHATNCBAI"
        >

        <div>

            <div class="name">
                CHATNCBAI
            </div>

            <div class="status">
                ● AI đang hoạt động
            </div>

        </div>

    </div>


    <!-- ================= CHAT ================= -->

    <div
        class="chat"
        id="chat">
    </div>


    <!-- ================= QUICK ================= -->

    <div class="quick">

        <button
            type="button"
            onclick="sayHello()">

            HI CHATNCBAI

        </button>

    </div>


    <!-- ================= INPUT ================= -->

    <div class="input-area">

        <input
            id="messageInput"
            type="text"
            placeholder="Nhập tin nhắn..."
            autocomplete="off"
        >

        <button
            id="sendButton"
            type="button"
            onclick="sendMessage()">

            Gửi

        </button>

    </div>

</div>


<script>

/* =====================================================
   CẤU HÌNH GEMINI
===================================================== */

/*
   DÁN API KEY CỦA BẠN VÀO ĐÂY.

   Không gửi API key cho người khác.
*/

const API_KEY = "DAN_API_KEY_CUA_BAN";


/*
   Model Gemini
*/

const MODEL = "gemini-2.5-flash";


/* =====================================================
   AVATAR
===================================================== */

const AVATAR =
"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSWIfjgbrzcACUkgXyYLLNBlP--ZKC_79-ZBKwkFLeX4A&s";


/* =====================================================
   LẤY ELEMENT
===================================================== */

const chat =
document.getElementById("chat");

const input =
document.getElementById("messageInput");

const sendButton =
document.getElementById("sendButton");


/* =====================================================
   THÊM TIN NHẮN
===================================================== */

function addMessage(text, type) {

    const message =
    document.createElement("div");

    message.className =
    "message " + type;


    const bubble =
    document.createElement("div");

    bubble.className =
    "bubble";

    bubble.textContent =
    text;


    message.appendChild(bubble);

    chat.appendChild(message);


    /*
       Cuộn xuống cuối
    */

    setTimeout(function() {

        chat.scrollTop =
        chat.scrollHeight;

    }, 10);


    return bubble;
}


/* =====================================================
   LỜI CHÀO
===================================================== */

function sayHello() {

    addMessage(
        "HI CHATNCBAI",
        "user"
    );


    setTimeout(function() {

        addMessage(
            "Chào bạn! CHATNCBAI rất vui được trả lời câu hỏi của bạn.",
            "ai"
        );

    }, 300);
}


/* =====================================================
   GỌI GEMINI
===================================================== */

async function askGemini(question) {

    if (
        API_KEY === "" ||
        API_KEY === "AQ.Ab8RN6Lw9w_5J_0-chkjpmE3yY4PXCWwjTMDTxq65CBVldTw7g"
    ) {

        throw new Error(
            "Chưa nhập Gemini API Key."
        );

    }


    const url =
    "https://generativelanguage.googleapis.com/v1beta/models/"
    + MODEL
    + ":generateContent";


    const response =
    await fetch(
        url,
        {
            method: "POST",

            headers: {

                "Content-Type":
                "application/json",

                "x-goog-api-key":
                API_KEY

            },

            body: JSON.stringify({

                contents: [

                    {

                        role: "user",

                        parts: [

                            {

                                text:
                                "Bạn là CHATNCBAI. "
                                +
                                "Hãy trả lời bằng tiếng Việt, "
                                +
                                "thân thiện, rõ ràng và dễ hiểu.\n\n"
                                +
                                question

                            }

                        ]

                    }

                ]

            })

        }
    );


    const data =
    await response.json();


    console.log(
        "Gemini response:",
        data
    );


    if (!response.ok) {

        throw new Error(

            data?.error?.message
            ||
            "Gemini API bị lỗi."

        );

    }


    const answer =
    data
    ?.candidates?.[0]
    ?.content
    ?.parts
    ?.map(function(part) {

        return part.text || "";

    })
    ?.join("")
    ?.trim();


    if (!answer) {

        throw new Error(
            "Gemini không trả về nội dung."
        );

    }


    return answer;
}


/* =====================================================
   HÀM GỬI — NÚT GỬI GỌI TRỰC TIẾP HÀM NÀY
===================================================== */

async function sendMessage() {

    /*
       Lấy nội dung
    */

    const text =
    input.value.trim();


    /*
       Nếu rỗng
    */

    if (text === "") {

        input.focus();

        return;

    }


    /*
       Hiện tin nhắn người chơi NGAY LẬP TỨC
    */

    addMessage(
        text,
        "user"
    );


    /*
       Xóa ô nhập
    */

    input.value = "";


    /*
       Nếu người chơi nhập HI CHATNCBAI
    */

    if (
        text.toLowerCase()
        ===
        "hi chatncbai"
    ) {

        setTimeout(function() {

            addMessage(
                "Chào bạn! CHATNCBAI rất vui được trả lời câu hỏi của bạn.",
                "ai"
            );

        }, 300);

        return;
    }


    /*
       Khóa nút trong lúc AI trả lời
    */

    sendButton.disabled =
    true;


    input.disabled =
    true;


    /*
       Hiện trạng thái
    */

    const aiBubble =
    addMessage(
        "CHATNCBAI đang suy nghĩ...",
        "ai"
    );


    try {

        /*
           Gọi Gemini
        */

        const answer =
        await askGemini(text);


        /*
           Hiện câu trả lời
        */

        aiBubble.textContent =
        answer;

    }

    catch(error) {

        console.error(
            error
        );


        /*
           Hiện lỗi ngay trong chat
        */

        aiBubble.textContent =
        "❌ Không thể kết nối Gemini.\n\n"
        +
        error.message;

    }


    /*
       Mở lại nút
    */

    sendButton.disabled =
    false;


    input.disabled =
    false;


    input.focus();


    chat.scrollTop =
    chat.scrollHeight;
}


/* =====================================================
   ENTER ĐỂ GỬI
===================================================== */

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
            &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   TIN NHẮN BAN ĐẦU
===================================================== */

addMessage(
    "Chào bạn! CHATNCBAI rất vui được trả lời câu hỏi của bạn.",
    "ai"
);


/* =====================================================
   FOCUS
===================================================== */

input.focus();

</script>

</body>
</html>
