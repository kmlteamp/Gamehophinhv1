<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Hợp Thể Hình</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        html, body {
            width: 100%; min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: white; overflow-x: hidden;
        }

        /* === KHUNG ĐĂNG NHẬP / ĐĂNG KÝ === */
        .auth-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center;
            z-index: 100; padding: 20px;
        }
        .auth-box {
            background: linear-gradient(145deg, #2a2a4a, #1f1f3a);
            border-radius: 20px; padding: 30px 25px; width: 100%; max-width: 400px;
            border: 2px solid #ffc107; box-shadow: 0 0 30px rgba(255,193,7,0.2);
        }
        .auth-box h2 {
            text-align: center; color: #ffc107; margin-bottom: 25px; font-size: 24px;
        }
        .tab-group { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab-btn {
            flex: 1; padding: 12px; background: rgba(255,255,255,0.05);
            border: none; color: #aaa; font-size: 16px; border-radius: 10px; cursor: pointer;
            transition: all 0.3s;
        }
        .tab-btn.active { background: #ffc107; color: #000; font-weight: bold; }
        .form-box { display: none; }
        .form-box.active { display: block; }
        .input-wrap { margin-bottom: 15px; }
        .input-wrap label {
            display: block; margin-bottom: 6px; color: #ffd700; font-size: 14px;
        }
        .input-wrap input {
            width: 100%; padding: 14px; border: 2px solid #444;
            border-radius: 10px; background: rgba(0,0,0,0.4);
            color: white; font-size: 16px; outline: none;
            transition: border 0.3s;
        }
        .input-wrap input:focus { border-color: #ffc107; }
        .btn {
            width: 100%; padding: 14px; background: linear-gradient(90deg, #ff6b00, #ffc107);
            border: none; border-radius: 10px; color: white;
            font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 8px;
        }
        .msg { margin-top: 12px; text-align: center; min-height: 24px; font-size: 14px; }
        .success { color: #4cd137; }
        .error { color: #ff6b6b; }

        /* === GIAO DIỆN SẢNH === */
        .lobby {
            display: none; width: 100%; min-height: 100vh;
            flex-direction: column; align-items: center;
            padding: 100px 20px 40px;
            position: relative;
        }
        .lobby.active { display: flex; }
        .lobby h1 {
            font-size: 32px; color: #ffc107; margin-bottom: 20px;
        }
        .play-btn {
            width: 200px; height: 200px;
            background: linear-gradient(135deg, #4cd137, #00c8ff);
            border: none; border-radius: 24px; color: white;
            font-size: 36px; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 40px rgba(76,209,55,0.4);
            margin-top: 20px;
            transition: transform 0.2s;
        }
        .play-btn:active { transform: scale(0.95); }

        /* === KHUNG VUÔNG UPDATE NEW — MỚI === */
        .update-box {
            width: 220px; height: 220px;
            background: #fff;
            border-radius: 16px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            margin-top: 25px;
            box-shadow: 0 0 25px rgba(255,255,255,0.3);
            border: 4px solid #ffc107;
            overflow: hidden;
        }
        .update-box img {
            width: 100%; height: 140px;
            object-fit: cover;
        }
        .update-text {
            font-size: 26px; font-weight: 900;
            color: #000;
            margin-top: 8px;
            letter-spacing: 2px;
        }
        .countdown-box {
            font-size: 18px; font-weight: bold;
            color: #e84118;
            margin-top: 6px;
            background: #f5f5f5;
            padding: 6px 14px;
            border-radius: 20px;
        }

        .top-bar {
            position: fixed; top: 15px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 10; flex-wrap: wrap; gap: 10px;
        }
        .user-info {
            background: rgba(255,255,255,0.1); padding: 10px 15px;
            border-radius: 12px; border: 1px solid #ffc107;
        }
        .user-info strong { color: #ffc107; }
        /* === KHUNG TIỀN === */
        .coin-box {
            background: linear-gradient(135deg, #ffc107, #ff9800);
            padding: 8px 18px; border-radius: 30px;
            border: 2px solid #fff; box-shadow: 0 0 15px rgba(255,193,7,0.5);
            display: flex; align-items: center; gap: 8px;
            font-weight: bold; font-size: 18px; color: #000;
        }
        .coin-icon { font-size: 24px; }
        .logout-btn {
            padding: 10px 20px; background: #e84118;
            border: none; border-radius: 8px; color: white;
            font-size: 15px; cursor: pointer;
            transition: background 0.2s;
        }
        .logout-btn:hover { background: #c0392b; }

        /* === CỤC HÌNH TRÒN NỔI === */
        .floating-circle {
            position: fixed; right: 15px; top: 50%; transform: translateY(-50%);
            width: 55px; height: 55px; border-radius: 50%;
            background: linear-gradient(135deg, #ff6b00, #ffc107);
            border: 3px solid #fff; box-shadow: 0 0 20px rgba(255,107,0,0.5);
            cursor: pointer; z-index: 50; overflow: hidden;
            transition: all 0.3s ease;
        }
        .floating-circle.hidden { display: none; }
        .floating-circle img { width: 100%; height: 100%; object-fit: cover; }
        .floating-circle:active { transform: translateY(-50%) scale(0.9); }

        /* === KHUNG NHẬP CODE === */
        .code-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center;
            z-index: 200; padding: 20px;
        }
        .code-modal.show { display: flex; }
        .code-box {
            background: linear-gradient(145deg, #2a2a4a, #1f1f3a);
            border-radius: 20px; padding: 30px 25px; width: 100%; max-width: 380px;
            border: 2px solid #ffc107; box-shadow: 0 0 30px rgba(255,193,7,0.3);
        }
        .code-box h3 {
            text-align: center; color: #ffc107; margin-bottom: 20px; font-size: 22px;
        }
        .code-input {
            width: 100%; padding: 15px; font-size: 18px; text-align: center;
            border: 2px solid #ffc107; border-radius: 12px;
            background: rgba(0,0,0,0.5); color: white; outline: none;
            margin-bottom: 15px;
        }
        .code-hint {
            text-align: center; color: #888; font-size: 14px; margin-bottom: 20px;
        }
        .code-submit {
            width: 100%; padding: 14px; font-size: 18px; font-weight: bold;
            background: linear-gradient(90deg, #ff6b00, #ffc107);
            border: none; border-radius: 10px; color: white; cursor: pointer;
        }
        .code-close {
            margin-top: 12px; width: 100%; padding: 10px;
            background: transparent; border: 1px solid #666;
            border-radius: 8px; color: #ccc; cursor: pointer; font-size: 15px;
        }
        .code-msg { margin-top: 12px; text-align: center; min-height: 24px; font-size: 14px; }

        /* === ANIMATION TIỀN BAY === */
        @keyframes coinFly {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-120px) scale(1.8); opacity: 0; }
        }
        .coin-fly {
            position: fixed; font-size: 36px; z-index: 300;
            pointer-events: none; animation: coinFly 1.2s ease-out forwards;
            text-shadow: 0 0 15px #ffc107, 0 0 30px #ff9800;
            font-weight: bold;
        }
        /* === THÔNG BÁO ĐẶC BIỆT === */
        .special-drop {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #ff6b00, #ffc107);
            padding: 25px 40px; border-radius: 20px; border: 3px solid #fff;
            box-shadow: 0 0 40px rgba(255,107,0,0.6);
            z-index: 250; text-align: center; display: none;
            animation: popIn 0.5s ease-out;
        }
        .special-drop.show { display: block; }
        .special-drop h3 { font-size: 24px; color: #fff; margin-bottom: 10px; }
        .special-drop p { font-size: 18px; color: #fff; opacity: 0.9; }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* === GIAO DIỆN GAME === */
        .game-screen {
            display: none; width: 100%; min-height: 100vh;
            flex-direction: column; align-items: center;
            padding: 90px 20px 40px;
        }
        .game-screen.active { display: flex; }
        .game-screen h2 {
            font-size: 24px; color: #ffc107; margin-bottom: 25px;
        }

        /* === 2 KHUNG CHỌN HÌNH TRÊN === */
        .top-slots {
            display: flex; gap: 20px; margin-bottom: 25px; flex-wrap: wrap; justify-content: center;
        }
        .slot-box {
            width: 140px; height: 140px;
            background: rgba(255,255,255,0.08);
            border: 3px dashed #ffc107;
            border-radius: 15px; display: flex; align-items: center; justify-content: center;
            overflow: hidden; transition: all 0.3s;
        }
        .slot-box.filled {
            border-style: solid; background: rgba(255,215,0,0.1);
        }
        .slot-box img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .slot-box.filled img { display: block; }
        .slot-placeholder { color: #888; font-size: 14px; }
        .slot-box.filled .slot-placeholder { display: none; }

        /* === NÚT HỢP THỂ === */
        .merge-btn {
            padding: 16px 50px; font-size: 22px; font-weight: bold;
            background: linear-gradient(90deg, #ff6b00, #ffc107);
            border: none; border-radius: 14px; color: white;
            cursor: pointer; margin-bottom: 25px;
            box-shadow: 0 0 20px rgba(255,107,0,0.3);
            transition: transform 0.2s;
        }
        .merge-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .merge-btn:active:not(:disabled) { transform: scale(0.95); }

        /* === KHUNG KẾT QUẢ HỢP THỂ === */
        .result-box {
            width: 180px; height: 180px;
            background: rgba(255,255,255,0.1);
            border: 4px solid #ffd700;
            border-radius: 18px; display: none; align-items: center; justify-content: center;
            overflow: hidden; margin-bottom: 30px;
            box-shadow: 0 0 30px rgba(255,215,0,0.3);
            animation: popIn 0.4s ease-out;
            opacity: 0; transform: scale(0.8);
            transition: all 0.4s ease;
        }
        .result-box.show { 
            display: flex; 
            opacity: 1; 
            transform: scale(1);
        }
        .result-box img { width: 100%; height: 100%; object-fit: cover; }

        /* === 4 KHUNG HÌNH NGẪU NHIÊN DƯỚI === */
        .image-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px;
            width: 100%; max-width: 340px; margin-bottom: 25px;
        }
        .grid-item {
            width: 100%; aspect-ratio: 1/1;
            background: rgba(255,255,255,0.08);
            border: 3px solid #444;
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            overflow: hidden; cursor: pointer; transition: all 0.3s;
        }
        .grid-item.selected {
            border-color: #ffc107; box-shadow: 0 0 15px rgba(255,215,0,0.4);
            transform: scale(1.05);
        }
        .grid-item img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .back-btn {
            padding: 12px 30px; background: transparent;
            border: 2px solid #666; border-radius: 10px;
            color: white; font-size: 16px; cursor: pointer;
            margin-top: 10px; transition: border-color 0.2s;
        }
        .back-btn:hover { border-color: #ffc107; }
    </style>
</head>
<body>
    <!-- === NHẠC NỀN: CHỈ THÊM NHẠC, KHÔNG THAY ĐỔI CƠ CHẾ/GIAO DIỆN === -->
    <audio id="bgMusic" loop preload="auto">
        <source src="https://files.catbox.moe/0hc6bh.mp3" type="audio/mpeg">
    </audio>

    <!-- === THÔNG BÁO ĐẶC BIỆT === -->
    <div class="special-drop" id="specialDrop">
        <h3>🎉 LUCKY DROP!</h3>
        <p>Nhận +1 💲 tiền!</p>
    </div>

    <!-- === KHUNG ĐĂNG NHẬP === -->
    <div class="auth-container" id="authPage">
        <div class="auth-box">
            <h2>🎮 GAME HỢP THỂ HÌNH</h2>
            <div class="tab-group">
                <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Đăng Nhập</button>
                <button class="tab-btn" id="tabReg" onclick="switchTab('register')">Đăng Ký</button>
            </div>

            <div class="form-box active" id="loginForm">
                <div class="input-wrap">
                    <label>Tên tài khoản</label>
                    <input type="text" id="loginUser" placeholder="Nhập tài khoản">
                </div>
                <div class="input-wrap">
                    <label>Mật khẩu</label>
                    <input type="password" id="loginPass" placeholder="Nhập mật khẩu">
                </div>
                <button class="btn" onclick="doLogin()">ĐĂNG NHẬP</button>
                <div class="msg" id="loginMsg"></div>
            </div>

            <div class="form-box" id="regForm">
                <div class="input-wrap">
                    <label>Tên tài khoản</label>
                    <input type="text" id="regUser" placeholder="Nhập tài khoản">
                </div>
                <div class="input-wrap">
                    <label>Mật khẩu</label>
                    <input type="password" id="regPass" placeholder="Nhập mật khẩu">
                </div>
                <div class="input-wrap">
                    <label>Xác nhận mật khẩu</label>
                    <input type="password" id="regPass2" placeholder="Nhập lại mật khẩu">
                </div>
                <button class="btn" onclick="doRegister()">ĐĂNG KÝ</button>
                <div class="msg" id="regMsg"></div>
            </div>
        </div>
    </div>

    <!-- === CỤC HÌNH TRÒN NỔI === -->
    <div class="floating-circle" id="floatingCodeBtn" onclick="openCodeModal()">
        <img src="https://i.ibb.co/h1ZdXm3W/file-00000000dc7481f8b4c4205c2ffe0013.png" alt="Code" onerror="this.src='https://via.placeholder.com/55/ff6b00/ffffff?text=🎁'">
    </div>

    <!-- === KHUNG NHẬP CODE === -->
    <div class="code-modal" id="codeModal">
        <div class="code-box">
            <h3>🎁 NHẬP CODE NHẬN THƯỞNG</h3>
            <input type="text" class="code-input" id="codeInput" placeholder="Nhập code tại đây...">
            <p class="code-hint">💡 Nhận code từ fanpage của admin</p>
            <button class="code-submit" onclick="submitCode()">✅ XÁC NHẬN</button>
            <div class="code-msg" id="codeMsg"></div>
            <button class="code-close" onclick="closeCodeModal()">Đóng</button>
        </div>
    </div>

    <!-- === SẢNH CHÍNH === -->
    <div class="lobby" id="lobbyPage">
        <div class="top-bar">
            <div class="user-info">
                <strong>👤 </strong><span id="userName">Người chơi</span>
            </div>
            <div class="coin-box">
                <span class="coin-icon">💲</span>
                <span id="coinCount">0</span>
            </div>
            <button class="logout-btn" onclick="logout()">Đăng Xuất</button>
        </div>
        <h1>🏠 SẢNH CHÍNH</h1>
        <button class="play-btn" onclick="startGame()">▶<br>PLAY</button>

        <!-- === KHUNG VUÔNG UPDATE NEW — MỚI === -->
        <div class="update-box">
            <img src="https://i.ibb.co/yJsvSb7/file-000000003364820696838d1654e69ef7.png" alt="Update New">
            <div class="update-text">UPDATE NEW</div>
            <div class="countdown-box" id="countdown">00:00:00</div>
        </div>
    </div>

    <!-- === MÀN HÌNH GAME === -->
    <div class="game-screen" id="gamePage">
        <div class="top-bar">
            <div class="user-info">
                <strong>👤 </strong><span id="userName2">Người chơi</span>
            </div>
            <div class="coin-box">
                <span class="coin-icon">💲</span>
                <span id="coinCountGame">0</span>
            </div>
            <button class="logout-btn" onclick="logout()">Đăng Xuất</button>
        </div>

        <h2>🎯 CHỌN HÌNH ĐỂ HỢP THỂ</h2>

        <!-- 2 KHUNG TRÊN ĐỂ CHỌN HÌNH -->
        <div class="top-slots">
            <div class="slot-box" id="slot1">
                <span class="slot-placeholder">Hình 1</span>
                <img src="" alt="" id="slot1Img">
            </div>
            <div class="slot-box" id="slot2">
                <span class="slot-placeholder">Hình 2</span>
                <img src="" alt="" id="slot2Img">
            </div>
        </div>

        <!-- NÚT HỢP THỂ -->
        <button class="merge-btn" id="mergeButton" onclick="doMerge()" disabled>✨ HỢP THỂ</button>

        <!-- KHUNG KẾT QUẢ HỢP THỂ -->
        <div class="result-box" id="resultBox">
            <img src="" alt="Kết quả hợp thể" id="resultImg">
        </div>

        <!-- 4 KHUNG HÌNH NGẪU NHIÊN DƯỚI -->
        <p style="color:#00c8ff; margin-bottom:10px;">📦 Chọn hình bên dưới:</p>
        <div class="image-grid" id="imageGrid">
            <div class="grid-item" id="img0" onclick="selectImage(0)"><img src="" alt=""></div>
            <div class="grid-item" id="img1" onclick="selectImage(1)"><img src="" alt=""></div>
            <div class="grid-item" id="img2" onclick="selectImage(2)"><img src="" alt=""></div>
            <div class="grid-item" id="img3" onclick="selectImage(3)"><img src="" alt=""></div>
        </div>

        <button class="back-btn" onclick="backToLobby()">← Quay lại sảnh</button>
    </div>

    <script>
        let currentUser = null;
        let selectedImages = [null, null];
        let userCoins = 0;
        let allUsers = JSON.parse(localStorage.getItem('gameUsers') || '{}');

        // === MÃ CODE: bang123pm = +8 TIỀN ===
        const validCodes = {
            'bang123pm': { coins: 8, used: false }
        };

        // === 6 HÌNH CHỌN ===
        const imageList = [
            'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSSdanyevjhZPw8AJkBqOvOAItGtBlQgeqWlLgMZvMTGA&s=10',
            'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTCrV_SU4aJj7u5dzLKQvOl-VrmEkNDK19H0pq-CQB_wQ&s=10',
            'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ2BTztla2FvSmf-Jko4V9ksVgVodknDnCRhanTKn82iQ&s=10',
            'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTGAcMCGargmqDM9pukxS7TjPM62HISQM9BDdNO_XIIqw&s=10',
            'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSxOVsYQgQDnG9TbpIiVgp5b1amzeYB5lGcDbPO3DjfJg&s=10',
            'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTa1XLtfDLcZuH_h3Vrm_UPgEiM9sVIQGENp_wZo3B2wA&s=10'
        ];

        // === 4 HÌNH HỢP THỂ ===
        const mergeResultImages = [
            'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTZSDgICRvSJtV6vDowVnKmfZQYmvkGWfoglT_9mPuITg&s=10',
            'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRyg7OvlLppNWYtAkdKC3O1G3LaASOLWCjiB_y8CWqQ6Q&s=10',
            'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT7UIbmW3B1ODjhsmJoSlsHQlp1H4IFKtP6gMb1JeoOVg&s=10',
            'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ2geb1TXyYlC7n8NShczT2RPpkHFW0NSSeiDeaqogsPg&s=10'
        ];

        // === ĐẾM NGƯỢC ĐẾN 2H SÁNG GIỜ VIỆT NAM (UTC+7) ===
        function updateCountdown() {
            const now = new Date();
            const target = new Date();
            target.setHours(2, 0, 0, 0); // 2:00 sáng cùng ngày
            
            // Nếu đã quá 2h sáng → đặt cho ngày mai 2h
            if (now > target) target.setDate(target.getDate() + 1);
            
            const diff = target - now;
            const h = Math.floor(diff / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            
            document.getElementById('countdown').textContent = 
                `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        // === CẬP NHẬT TIỀN ===
        function updateCoinDisplay() {
            document.getElementById('coinCount').textContent = userCoins;
            document.getElementById('coinCountGame').textContent = userCoins;
            if (currentUser) {
                if (!allUsers[currentUser]) allUsers[currentUser] = {};
                allUsers[currentUser].coins = userCoins;
                localStorage.setItem('gameUsers', JSON.stringify(allUsers));
            }
        }

        // === ANIMATION TIỀN BAY ===
        function showCoinFly(amount = 1) {
            for (let i = 0; i < 8; i++) {
                setTimeout(() => {
                    const coin = document.createElement('div');
                    coin.className = 'coin-fly';
                    coin.textContent = `💲+${amount}`;
                    coin.style.left = (Math.random() * 50 + 25) + '%';
                    coin.style.top = '45%';
                    document.body.appendChild(coin);
                    setTimeout(() => coin.remove(), 1200);
                }, i * 80);
            }
        }

        // === KIỂM TRA THÔNG BÁO ĐẶC BIỆT ===
        function checkSpecialDrop() {
            const chance = Math.random() * 100;
            if (chance < 5) {
                document.getElementById('specialDrop').classList.add('show');
                userCoins += 1;
                updateCoinDisplay();
                setTimeout(() => {
                    document.getElementById('specialDrop').classList.remove('show');
                }, 2000);
                return true;
            }
            return false;
        }

        // === TAB ĐĂNG NHẬP/ĐĂNG KÝ ===
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.form-box').forEach(f => f.classList.remove('active'));
            document.getElementById('loginMsg').textContent = '';
            document.getElementById('regMsg').textContent = '';
            if (tab === 'login') {
                document.getElementById('tabLogin').classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.getElementById('tabReg').classList.add('active');
                document.getElementById('regForm').classList.add('active');
            }
        }

        // === ĐĂNG KÝ ===
        function doRegister() {
            const u = document.getElementById('regUser').value.trim();
            const p = document.getElementById('regPass').value;
            const p2 = document.getElementById('regPass2').value;
            if (!u || !p || !p2) return showMsg('regMsg', 'error', '⚠️ Điền đầy đủ thông tin!');
            if (u.length < 3) return showMsg('regMsg', 'error', '⚠️ Tên ≥ 3 ký tự!');
            if (p.length < 6) return showMsg('regMsg', 'error', '⚠️ Mật khẩu ≥ 6 ký tự!');
            if (p !== p2) return showMsg('regMsg', 'error', '⚠️ Mật khẩu không khớp!');
            if (allUsers[u]) return showMsg('regMsg', 'error', '❌ Tên đã tồn tại!');
            
            allUsers[u] = { password: p, coins: 0 };
            localStorage.setItem('gameUsers', JSON.stringify(allUsers));
            showMsg('regMsg', 'success', '✅ Tạo tài khoản thành công!');
            document.getElementById('regUser').value = '';
            document.getElementById('regPass').value = '';
            document.getElementById('regPass2').value = '';
        }

        // === ĐĂNG NHẬP ===
        function doLogin() {
            const u = document.getElementById('loginUser').value.trim();
            const p = document.getElementById('loginPass').value;
            if (!u || !p) return showMsg('loginMsg', 'error', '⚠️ Nhập tên & mật khẩu!');
            if (!allUsers[u] || allUsers[u].password !== p) 
                return showMsg('loginMsg', 'error', '❌ Sai tên hoặc mật khẩu!');
            
            currentUser = u;
            userCoins = allUsers[u].coins || 0;
            document.getElementById('authPage').style.display = 'none';
            document.getElementById('floatingCodeBtn').classList.remove('hidden');
            document.getElementById('lobbyPage').classList.add('active');
            document.getElementById('userName').textContent = u;
            updateCoinDisplay();
        }

        // === ĐĂNG XUẤT ===
        function logout() {
            currentUser = null;
            userCoins = 0;
            selectedImages = [null, null];
            document.getElementById('lobbyPage').classList.remove('active');
            document.getElementById('gamePage').classList.remove('active');
            document.getElementById('floatingCodeBtn').classList.add('hidden');
            document.getElementById('authPage').style.display = 'flex';
        }

        function showMsg(id, type, text) {
            const el = document.getElementById(id);
            el.textContent = text;
            el.className = `msg ${type}`;
        }

        // === MỞ KHUNG CODE ===
        function openCodeModal() {
            document.getElementById('codeModal').classList.add('show');
            document.getElementById('codeInput').value = '';
            document.getElementById('codeMsg').textContent = '';
        }

        function closeCodeModal() {
            document.getElementById('codeModal').classList.remove('show');
        }

        // === NHẬP CODE ===
        function submitCode() {
            if (!currentUser) return showMsg('codeMsg', 'error', '⚠️ Đăng nhập trước!');
            const code = document.getElementById('codeInput').value.trim();
            if (!code) return showMsg('codeMsg', 'error', '⚠️ Nhập code!');
            
            const codeData = validCodes[code];
            if (codeData && !codeData.used) {
                codeData.used = true;
                userCoins += codeData.coins;
                updateCoinDisplay();
                showCoinFly(codeData.coins);
                showMsg('codeMsg', 'success', `✅ NHẬN ${codeData.coins} TIỀN THÀNH CÔNG! 💲💸`);
            } else if (codeData && codeData.used) {
                showMsg('codeMsg', 'error', '❌ Code đã được dùng!');
            } else {
                showMsg('codeMsg', 'error', '❌ Code không hợp lệ!');
            }
        }

        // === BẮT ĐẦU GAME ===
        function startGame() {
            // Phát nhạc khi người chơi bấm PLAY (được phép bởi thao tác chạm/click)
            const bgMusic = document.getElementById('bgMusic');
            bgMusic.volume = 0.5;
            bgMusic.play().catch(() => {});

            selectedImages = [null, null];
            document.getElementById('lobbyPage').classList.remove('active');
            document.getElementById('gamePage').classList.add('active');
            document.getElementById('userName2').textContent = currentUser;
            document.getElementById('resultBox').classList.remove('show');
            document.getElementById('resultImg').src = '';
            document.getElementById('mergeButton').disabled = true;
            updateCoinDisplay();
            renderRandomImages();
        }

        // === RENDER 4 HÌNH NGẪU NHIÊN ===
        function renderRandomImages() {
            let shuffled = [...imageList].sort(() => Math.random() - 0.5).slice(0, 4);
            for (let i = 0; i < 4; i++) {
                const item = document.getElementById(`img${i}`);
                item.querySelector('img').src = shuffled[i];
                item.dataset.url = shuffled[i];
                item.classList.remove('selected');
            }
            selectedImages = [null, null];
            document.getElementById('slot1').classList.remove('filled');
            document.getElementById('slot2').classList.remove('filled');
            document.getElementById('slot1Img').src = '';
            document.getElementById('slot2Img').src = '';
            document.getElementById('mergeButton').disabled = true;
        }

        // === CHỌN HÌNH ===
        function selectImage(index) {
            const item = document.getElementById(`img${index}`);
            const url = item.dataset.url;
            
            if (item.classList.contains('selected')) {
                item.classList.remove('selected');
                if (selectedImages[0] === url) {
                    selectedImages[0] = null;
                    document.getElementById('slot1').classList.remove('filled');
                    document.getElementById('slot1Img').src = '';
                } else if (selectedImages[1] === url) {
                    selectedImages[1] = null;
                    document.getElementById('slot2').classList.remove('filled');
                    document.getElementById('slot2Img').src = '';
                }
            } else {
                if (!selectedImages[0]) {
                    selectedImages[0] = url;
                    document.getElementById('slot1').classList.add('filled');
                    document.getElementById('slot1Img').src = url;
                    item.classList.add('selected');
                } else if (!selectedImages[1]) {
                    selectedImages[1] = url;
                    document.getElementById('slot2').classList.add('filled');
                    document.getElementById('slot2Img').src = url;
                    item.classList.add('selected');
                } else {
                    return;
                }
            }

            document.getElementById('mergeButton').disabled = !(selectedImages[0] && selectedImages[1]);
        }

        // === HỢP THỂ ===
        function doMerge() {
            if (!selectedImages[0] || !selectedImages[1]) return;
            
            const randomImg = mergeResultImages[Math.floor(Math.random() * mergeResultImages.length)];
            document.getElementById('resultImg').src = randomImg;
            document.getElementById('resultBox').classList.add('show');
            
            userCoins += 1;
            updateCoinDisplay();
            showCoinFly(1);
            checkSpecialDrop();
            
            setTimeout(() => {
                selectedImages = [null, null];
                document.getElementById('slot1').classList.remove('filled');
                document.getElementById('slot2').classList.remove('filled');
                document.getElementById('slot1Img').src = '';
                document.getElementById('slot2Img').src = '';
                document.getElementById('resultBox').classList.remove('show');
                document.getElementById('resultImg').src = '';
                document.getElementById('mergeButton').disabled = true;
                renderRandomImages();
            }, 2500);
        }

        // === QUAY LẠI SẢNH ===
        function backToLobby() {
            selectedImages = [null, null];
            document.getElementById('slot1').classList.remove('filled');
            document.getElementById('slot2').classList.remove('filled');
            document.getElementById('slot1Img').src = '';
            document.getElementById('slot2Img').src = '';
            document.getElementById('resultBox').classList.remove('show');
            document.getElementById('resultImg').src = '';
            document.getElementById('mergeButton').disabled = true;
            document.getElementById('gamePage').classList.remove('active');
            document.getElementById('lobbyPage').classList.add('active');
        }

        document.getElementById('floatingCodeBtn').classList.add('hidden');
    </script>
</body>
</html>
